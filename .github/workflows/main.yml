name: Generate animation

on:

# Atualiza automaticamente todos os dias

schedule:
- cron: "0 0 * * *"

# Permite executar manualmente pelo GitHub

workflow_dispatch:

# Executa quando houver push na branch principal

push:
branches:
- main

jobs:
generate:
permissions:
contents: write

```
runs-on: ubuntu-latest
timeout-minutes: 5

steps:

  # Gera a animação das contribuições
  - name: Generate GitHub contribution snake
    uses: Platane/snk/svg-only@v3
    with:
      github_user_name: ${{ github.repository_owner }}
      outputs: |
        dist/github-contribution-grid-snake.svg
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark

  # Envia os arquivos gerados para a branch output
  - name: Push snake to output branch
    uses: crazy-max/ghaction-github-pages@v3.1.0
    with:
      target_branch: output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```

